<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1423" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Cozy Farming Simulator MVP" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Cozy Farming Simulator MVP: a cozy pixel-art farming game. Plant, fish, befriend the valley and light every lantern." />
    <title>Cozy Farming Simulator MVP</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1423; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
      #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #efe2c7; font: 600 14px/1.2 ui-rounded, system-ui, sans-serif; letter-spacing: 0.08em; transition: opacity 0.4s; pointer-events: none; }
      #boot .lamp { width: 18px; height: 18px; border-radius: 50%; background: #ffc95e; box-shadow: 0 0 24px 10px rgba(255, 166, 58, 0.55); animation: glow 1.6s ease-in-out infinite; }
      #boot.done { opacity: 0; }
      #boot.stuck .lamp { animation: none; opacity: 0.35; }
      #boot .why { max-width: 320px; padding: 0 20px; text-align: center; font-weight: 400; letter-spacing: 0; line-height: 1.5; opacity: 0.9; }
      .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
      @keyframes glow { 0%, 100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { #boot .lamp { animation: none; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="sr">
      <h1>Cozy Farming Simulator MVP</h1>
      <p>A cozy pixel-art farming game. Grow crops, fish, make friends in the valley and light every lantern. It is drawn on a canvas, so the goal and what happens are spoken in the live region below.</p>
      <h2>Controls</h2>
      <ul id="how"></ul>
      <div id="live" role="status" aria-live="polite"></div>
    </div>
    <div id="boot"><div class="lamp"></div><div>COZY FARMING SIMULATOR MVP</div></div>
    <noscript>Cozy Farming Simulator MVP needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
