<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1423" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Lantern Hollow: a cozy pixel-art farming game. Plant, fish, befriend the valley and light every lantern." />
    <title>Lantern Hollow</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1423; overflow: hidden; overscroll-behavior: none; }
      body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: absolute; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      #game canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
      #boot { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #efe2c7; font: 600 14px/1.2 ui-rounded, system-ui, sans-serif; letter-spacing: 0.08em; transition: opacity 0.4s; pointer-events: none; }
      #boot .lamp { width: 18px; height: 18px; border-radius: 50%; background: #ffc95e; box-shadow: 0 0 24px 10px rgba(255, 166, 58, 0.55); animation: glow 1.6s ease-in-out infinite; }
      #boot.done { opacity: 0; }
      @keyframes glow { 0%, 100% { transform: scale(0.85); opacity: 0.7; } 50% { transform: scale(1.1); opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="boot"><div class="lamp"></div><div>LANTERN HOLLOW</div></div>
    <noscript>Lantern Hollow needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
